# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The project lives in a Cyrillic path on Windows; AGP's ASCII path check is
# disabled intentionally (the build is verified with a real assembleDebug).
android.overridePathCheck=true
# AndroidX is required by Material Components and the AndroidX libraries.
android.useAndroidX=true
# Keep R classes per module to speed up builds.
android.nonTransitiveRClass=true
kotlin.code.style=official
